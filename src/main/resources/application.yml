server:
  port: 8085
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: inb-public-portal-service

  datasource:
    url: jdbc:postgresql://localhost:5433/inb_portal_db
    username: inb_user
    password: MOI@123
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: inb-portal-hikari
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate   # Schema is owned by Flyway migrations, never by Hibernate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false     # Anti-pattern to leave true; forces explicit fetch strategy in service layer

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

logging:
  level:
    root: INFO
    gov.kh.moi.inb: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# --- Application-specific configuration ---
app:
  jwt:
    # In production this secret comes from a secrets manager / env var, never committed.
    secret: ${JWT_SECRET:CHANGE_ME_dev_only_secret_key_must_be_at_least_256_bits_long_1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}   # 1 hour
  file-storage:
    # Local disk for now; swapped for a MinioFileStorageServiceImpl later without touching
    # any controller/service code, since callers depend only on the FileStorageService interface.
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}
    public-base-url: ${FILE_PUBLIC_BASE_URL:http://localhost:8085/files}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
