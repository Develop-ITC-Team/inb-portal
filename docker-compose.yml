version: "3.9"

services:
  inb-postgres:
    image: postgres:15-alpine
    container_name: inb-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inb_portal_db
      POSTGRES_USER: inb_user
      POSTGRES_PASSWORD: MOI@123
    ports:
      # Mapped to 5433 on host to avoid colliding with a native Postgres install
      - "5433:5432"
    volumes:
      - inb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inb_user -d inb_portal_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  inb_postgres_data:
