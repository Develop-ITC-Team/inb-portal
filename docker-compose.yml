version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: inb-postgres
    environment:
      POSTGRES_USER: inb_user
      POSTGRES_PASSWORD: MOI@123
      POSTGRES_DB: inb_portal_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: